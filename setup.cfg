[metadata]
name = robot-board
version = attr: robot_board.__version__
description = Driver for the Hiwonder 4-channel motor expansion board on a Raspberry Pi 4 (Ubuntu 22.04)
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = robot_board
python_requires = >=3.8
# RPi.GPIO comes from Ubuntu (python3-rpi.gpio), see scripts/install.sh
install_requires =
    smbus2
    rpi_ws281x

[options.entry_points]
console_scripts =
    robot-board = robot_board.cli:main
